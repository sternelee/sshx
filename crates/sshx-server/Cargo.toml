[package]
name = "sshx-server"
version.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
edition = "2021"

[features]
default = []
embedded = ["dep:rust-embed"]
reflection = ["dep:tonic-reflection"]

[dependencies]
anyhow.workspace = true
async-channel = "2.5"
async-stream = "0.3"
axum = { version = "0.8", features = ["http2", "ws"] }
base64 = "0.22"
bytes = { version = "1.11", features = ["serde"] }
ciborium = "0.2.1"
clap.workspace = true
dashmap = "6.1"
deadpool = "0.13"
deadpool-redis = "0.23"
futures-util = { version = "0.3", features = ["sink"] }
hmac = "0.13"
http = "1.4"
parking_lot = "0.12"
prost.workspace = true
rand.workspace = true
redis = { version = "1.2", features = ["tokio-rustls-comp", "tls-rustls-webpki-roots"] }
rust-embed = { version = "8", optional = true }
serde.workspace = true
sha2 = "0.11"
sshx-core.workspace = true
subtle = "2.6"
tokio.workspace = true
tokio-stream.workspace = true
tokio-tungstenite = "0.29"
tonic.workspace = true
tonic-reflection = { workspace = true, optional = true }
tower = { version = "0.5", features = ["steer"] }
tower-http = { version = "0.6.2", features = ["fs", "redirect", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zstd = "0.13"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false }
sshx = { path = "../sshx" }
